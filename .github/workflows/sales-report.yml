name: Sales Report

on:
  workflow_run:
    workflows: ["Sync Firestore Data"]
    types:
      - completed
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # make sure this pulls the commit Sync Firestore Data just pushed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/dashboard.py
      - name: Commit updated summary
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/sales-summary.json
          git diff --staged --quiet || git commit -m "Update sales summary [bot]"
          git push
